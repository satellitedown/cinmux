# This server belongs exclusively to this Cinmux state profile.
set -g default-terminal tmux-256color
set -g mouse on
set -g history-limit 50000
set -g status off
set -g remain-on-exit on
set -g detach-on-destroy on
set -g exit-unattached off
set -g focus-events on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 10
set -as terminal-features ',xterm-256color:RGB:clipboard:extkeys'
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
setw -g allow-rename off
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -n M-Enter split-window -v -c '#{pane_current_path}'
bind -n M-S-Enter split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind -n M-Escape confirm-before -p 'Close this pane and end its jobs? (y/n)' kill-pane
bind x confirm-before -p 'Close this pane and end its jobs? (y/n)' kill-pane
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Right resize-pane -R 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Down resize-pane -D 5

bind r command-prompt -I '#W' "rename-window -- '%%'"
bind c new-window -c '#{pane_current_path}'
bind k confirm-before -p 'Close this window and end its jobs? (y/n)' kill-window
bind '&' confirm-before -p 'Close this window and end its jobs? (y/n)' kill-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-S-Left swap-window -t :-1 \; previous-window
bind -n M-S-Right swap-window -t :+1 \; next-window

# A renderer never navigates to another entry through a built-in session chooser.
unbind s
unbind '('
unbind ')'
unbind L
unbind w
